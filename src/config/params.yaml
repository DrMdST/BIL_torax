# NeuroRad Analytics - Radiomics Processing Parameters
# Based on pyradiomics configuration
# Features are computed ONLY within the region defined by the .seg.nrrd mask

image:
  # Input image file (.nrrd)
  format: nrrd
  # Convert to grayscale if multi-channel
  to_gray: true

mask:
  # Segmentation mask file (.seg.nrrd)
  format: nrrd
  # Label value in the mask that defines the region of interest
  # All voxels with this value (or any non-zero value) form the ROI
  label: 1

featureClass:
  # First-order statistics — computed from image intensities within the mask
  firstorder:
    - Mean
    - StandardDeviation
    - Variance
    - Skewness
    - Kurtosis
    - Minimum
    - Maximum
    - Range
    - Median
    - 10Percentile
    - 25Percentile
    - 75Percentile
    - 90Percentile
    - Entropy

  # GLCM texture features — computed from gray levels within the mask
  glcm:
    - Contrast
    - Correlation
    - JointEnergy
    - Idm

  # Shape / morphological features — computed from the mask geometry
  shape2D:
    - PixelArea
    - Perimeter
    - Eccentricity
    - MeshVolume

processing:
  # Axis for 2D slice extraction from 3D volumes
  slice_axis: 0
  # Maximum slices to process
  max_slices: 50
  # Normalize intensity to 0-255 for visualization only
  normalize: true

output:
  excel_filename: "radiomics_results.xlsx"
  image_filename: "processed_image.png"
  mask_filename: "processed_mask.png"
