imageType:
  Original: {}
  LoG:
    sigma: [1.0, 3.0]
  Wavelet: {}

featureClass:
  firstorder: {}
  shape: {}
  shape2D: {}
  glcm: {}
  glrlm: {}
  glszm: {}
  gldm: {}
  ngtdm: {}

setting:
  label: 1                  # КРИТИЧНО: указывает анализировать сегмент №1 в .seg.nrrd
  binWidth: 25              # Стандарт для КТ. Для МРТ может потребоваться нормализация и binWidth: 1.0
  resampledPixelSpacing: null # null сохраняет оригинальный Spacing из файла. Не меняйте на 1.0!
  interpolator: sitkBSpline
  force2D: false            # Оставляем честный 3D-анализ
  verbose: true